          class ShipHullSketchPainter extends CustomPainter {
            @override
            void paint(Canvas canvas, Size size) {
              final w = size.width;
              final h = size.height;

              final path = Path();
              path.moveTo(w * 0.5, h * 0.02);
              path.quadraticBezierTo(w * 0.92, h * 0.28, w * 0.88, h * 0.65);
              path.lineTo(w * 0.84, h * 0.92);
              path.quadraticBezierTo(w * 0.5, h * 0.98, w * 0.16, h * 0.92);
              path.lineTo(w * 0.12, h * 0.65);
              path.quadraticBezierTo(w * 0.08, h * 0.28, w * 0.5, h * 0.02);
              path.close();

              final fillPaint = Paint()
                ..color = const Color(0xFF1A2634)
                ..style = PaintingStyle.fill;
              final strokePaint = Paint()
                ..color = Colors.white70
                ..style = PaintingStyle.stroke
                ..strokeWidth = 3.0;

              canvas.drawPath(path, fillPaint);
              canvas.drawPath(path, strokePaint);
            }

            @override
            bool shouldRepaint(covariant CustomPainter oldDelegate) => false;
          }

          class SeedPoint {
            final Offset imagePx, screenPx;
            final double zMeter;
            SeedPoint({required this.imagePx, required this.screenPx, required this.zMeter});
          }

          class CameraMeasureScreen extends StatefulWidget {
            final List<CameraDescription> cameras;
            final String stationTitle;
            final double flareDeg;
            final double initialHintM;

            const CameraMeasureScreen({
              super.key,
              required this.cameras,
              required this.stationTitle,
              required this.flareDeg,
              required this.initialHintM,
            });

            @override
            State<CameraMeasureScreen> createState() => _CameraMeasureScreenState();
          }

          class _CameraMeasureScreenState extends State<CameraMeasureScreen> {
            CameraController? _camController;
            NativeDraftBridge? _bridge;
            StreamSubscription<AccelerometerEvent>? _imuSub;

            double _gx = 0.0, _gy = 9.81, _gz = 0.0;
            bool _isStreaming = false, _isLockedOn = false;
            late double _nextSeedDraftM;
            final List<SeedPoint> _manualSeeds = [];
            CameraImage? _latestImage;

            double _instantDraftM = 0.0;
            Offset _waterlinePx = Offset.zero;
            List<Offset> _spineCurvePx = [];
            List<MapEntry<double, Offset>> _trackedMarks = [];
            int _collectedFrames = 0;

            @override
            void initState() {
              super.initState();
              _nextSeedDraftM = double.parse(widget.initialHintM.toStringAsFixed(1));
              _bridge = NativeDraftBridge(fps: 30.0, flareDeg: widget.flareDeg);
              _imuSub = accelerometerEvents.listen((e) {
                _gx = 0.85 * _gx + 0.15 * e.x;
                _gy = 0.85 * _gy + 0.15 * e.y;
                _gz = 0.85 * _gz + 0.15 * e.z;
              });
              _initCamera();
            }

            Future<void> _initCamera() async {
              if (widget.cameras.isEmpty) return;
              _camController = CameraController(
                widget.cameras.first,
                ResolutionPreset.veryHigh,
                enableAudio: false,
                imageFormatGroup: ImageFormatGroup.yuv420,
              );
              await _camController!.initialize();
              await _camController!.startImageStream(_onCameraFrame);
              if (mounted) setState(() {});
            }

            void _onCameraFrame(CameraImage img) {
              _latestImage = img;
              if (!_isLockedOn || !_isStreaming || _bridge == null) return;
              final y = img.planes[0];
              final tel = _bridge!.processFrame(y.bytes, img.width, img.height, y.bytesPerRow, _gx, _gy, _gz);
              if (tel.statusCode == 1) {
                final marks = <MapEntry<double, Offset>>[];
                for (int i = 0; i < tel.activeMarkCount; i++) {
                  marks.add(MapEntry(tel.markZ[i], Offset(tel.markU[i], tel.markV[i])));
                }
                final spine = <Offset>[];
                for (int i = 0; i < tel.spinePtsCount; i++) {
                  spine.add(Offset(tel.spineU[i], tel.spineV[i]));
                }
                setState(() {
                  _instantDraftM = tel.instantDraftM;
                  _waterlinePx = Offset(tel.waterlineU, tel.waterlineV);
                  _trackedMarks = marks;
                  _spineCurvePx = spine;
                  _collectedFrames = tel.collectedFrames;
                });
                if (_collectedFrames >= 1200) _finishAndShowReport();
              }
            }

            void _onTapViewfinder(TapUpDetails details, BoxConstraints box) {
              if (_isLockedOn || _latestImage == null) return;
              final u = (details.localPosition.dx / box.maxWidth) * _latestImage!.width.toDouble();
              final v = (details.localPosition.dy / box.maxHeight) * _latestImage!.height.toDouble();
              setState(() {
                _manualSeeds.add(SeedPoint(
                  imagePx: Offset(u, v),
                  screenPx: details.localPosition,
                  zMeter: _nextSeedDraftM,
                ));
                _nextSeedDraftM = double.parse((_nextSeedDraftM - 0.2).toStringAsFixed(1));
              });
            }

            Future<void> _startLockOnScan() async {
              if (_manualSeeds.length < 2 || _latestImage == null || _camController == null) return;
              await _camController!.setFocusMode(FocusMode.locked);
              await _camController!.setExposureMode(ExposureMode.locked);
              final y = _latestImage!.planes[0];
              final ok = _bridge!.bootstrapSeeds(
                y.bytes,
                _latestImage!.width,
                _latestImage!.height,
                y.bytesPerRow,
                _manualSeeds.map((s) => s.imagePx.dx).toList(),
                _manualSeeds.map((s) => s.imagePx.dy).toList(),
                _manualSeeds.map((s) => s.zMeter).toList(),
              );
              if (ok) {
                setState(() {
                  _isLockedOn = true;
                  _isStreaming = true;
                });
              }
            }

            void _finishAndShowReport() {
              setState(() => _isStreaming = false);
              final res = _bridge!.solveFinalSurvey();
              if (res.isValid == 0) return;

              showModalBottomSheet(
                context: context,
                isDismissible: false,
                backgroundColor: const Color(0xFF101820),
                builder: (ctx) => Padding(
                  padding: const EdgeInsets.all(24),
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text('${widget.stationTitle} 파도 보정 결과',
                          style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                      const Divider(height: 20),
                      const Text('최종 정밀 흘수 (너울/물보라 제거됨)', style: TextStyle(fontSize: 12, color: Colors.white70)),
                      Text('${res.trueDraftM.toStringAsFixed(3)} m',
                          style: const TextStyle(fontSize: 42, fontWeight: FontWeight.bold, color: Colors.cyanAccent)),
                      const SizedBox(height: 10),
                      Text('• 단순 평균 (물보라 포함): ${res.simpleMeanM.toStringAsFixed(3)} m'),
                      Text('• 파도 흔들림 폭 (파고): 약 ${res.swellHeightM.toStringAsFixed(2)} m'),
                      Text('• 선체 반사파 보정량: -${res.sainflouDeductMm.toStringAsFixed(1)} mm'),
                      const SizedBox(height: 20),
                      Row(
                        children: [
                          Expanded(
                            child: OutlinedButton(
                              onPressed: () => Navigator.pop(ctx),
                              child: const Text('다시 찍기'),
                            ),
                          ),
                          const SizedBox(width: 12),
                          Expanded(
                            flex: 2,
                            child: ElevatedButton.icon(
                              style: ElevatedButton.styleFrom(backgroundColor: Colors.teal),
                              icon: const Icon(Icons.check_circle),
                              label: const Text('이 값으로 기록판에 저장', style: TextStyle(fontWeight: FontWeight.bold)),
                              onPressed: () {
                                Navigator.pop(ctx);
                                Navigator.pop(context, res.trueDraftM);
                              },
                            ),
                          ),
                        ],
                      ),
                    ],
                  ),
                ),
              );
            }

            @override
            void dispose() {
              _imuSub?.cancel();
              _camController?.dispose();
              _bridge?.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              if (_camController == null || !_camController!.value.isInitialized) {
                return const Scaffold(body: Center(child: CircularProgressIndicator()));
              }
              final sec = (_collectedFrames / 30.0).toStringAsFixed(1);
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: Colors.black87,
                  title: Text(widget.stationTitle, style: const TextStyle(fontSize: 16)),
                ),
                body: SafeArea(
                  child: Column(
                    children: [
                      Container(
                        width: double.infinity,
                        padding: const EdgeInsets.all(10),
                        color: Colors.black87,
                        child: Text(
                          _isLockedOn
                              ? '🌊 실시간 물선 위치: ${_instantDraftM.toStringAsFixed(3)} m (측정 시간: ${sec}초 / 권장 30초 이상)'
                              : '👆 화면 속 흘수 글자의 [맨 아랫줄]을 위에서부터 2~3곳 터치해 주세요 (${_manualSeeds.length}곳 선택됨)',
                          style: const TextStyle(color: Colors.amberAccent, fontSize: 13, fontWeight: FontWeight.bold),
                          textAlign: TextAlign.center,
                        ),
                      ),
                      Expanded(
                        child: LayoutBuilder(
                          builder: (ctx, box) => GestureDetector(
                            onTapUp: (d) => _onTapViewfinder(d, box),
                            child: Stack(
                              fit: StackFit.expand,
                              children: [
                                CameraPreview(_camController!),
                                CustomPaint(
                                  painter: DraftAROverlayPainter(
                                    isLockedOn: _isLockedOn,
                                    seeds: _manualSeeds,
                                    spinePx: _spineCurvePx,
                                    marks: _trackedMarks,
                                    waterlinePx: _waterlinePx,
                                    imgWidth: _latestImage?.width.toDouble() ?? 1920,
                                    imgHeight: _latestImage?.height.toDouble() ?? 1080,
                                  ),
                                ),
                              ],
                            ),
                          ),
                        ),
                      ),
                      Container(
                        padding: const EdgeInsets.all(12),
                        color: const Color(0xFF121212),
                        child: Column(
                          mainAxisSize: MainAxisSize.min,
                          children: [
                            if (!_isLockedOn)
                              Row(
                                children: [
                                  const Text('지금 터치할 글자 높이: ', style: TextStyle(fontSize: 13)),
                                  IconButton(
                                    icon: const Icon(Icons.remove_circle_outline),
                                    onPressed: () => setState(() => _nextSeedDraftM = double.parse((_nextSeedDraftM - 0.2).toStringAsFixed(1))),
                                  ),
                                  Text('${_nextSeedDraftM.toStringAsFixed(1)} m',
                                      style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.cyanAccent)),
                                  IconButton(
                                    icon: const Icon(Icons.add_circle_outline),
                                    onPressed: () => setState(() => _nextSeedDraftM = double.parse((_nextSeedDraftM + 0.2).toStringAsFixed(1))),
                                  ),
                                  const Spacer(),
                                  TextButton(
                                    onPressed: () => setState(() => _manualSeeds.clear()),
                                    child: const Text('다시 찍기'),
                                  ),
                                ],
                              ),
                            ElevatedButton.icon(
                              style: ElevatedButton.styleFrom(
                                backgroundColor: _isLockedOn ? Colors.redAccent : Colors.teal,
                                minimumSize: const Size.fromHeight(48),
                              ),
                              icon: Icon(_isLockedOn ? Icons.check_circle_outline : Icons.lock_outline),
                              label: Text(
                                _isLockedOn
                                    ? '측정 완료 및 결과 보기 (${sec}초 촬영됨)'
                                    : '눈금 고정 및 흔들림 방지 측정 시작',
                                style: const TextStyle(fontSize: 15, fontWeight: FontWeight.bold),
                              ),
                              onPressed: _isLockedOn ? _finishAndShowReport : _startLockOnScan,
                            ),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class DraftAROverlayPainter extends CustomPainter {
            final bool isLockedOn;
            final List<SeedPoint> seeds;
            final List<Offset> spinePx;
            final List<MapEntry<double, Offset>> marks;
            final Offset waterlinePx;
            final double imgWidth, imgHeight;

            DraftAROverlayPainter({
              required this.isLockedOn,
              required this.seeds,
              required this.spinePx,
              required this.marks,
              required this.waterlinePx,
              required this.imgWidth,
              required this.imgHeight,
            });

            Offset _toScreen(Offset pt, Size sz) => Offset((pt.dx / imgWidth) * sz.width, (pt.dy / imgHeight) * sz.height);

            @override
            void paint(Canvas canvas, Size size) {
              if (!isLockedOn) {
                final p = Paint()..color = Colors.amberAccent..style = PaintingStyle.stroke..strokeWidth = 2.5;
                for (final s in seeds) {
                  canvas.drawCircle(s.screenPx, 12, p);
                  final tp = TextPainter(
                    text: TextSpan(
                      text: '${s.zMeter.toStringAsFixed(1)}m',
                      style: const TextStyle(color: Colors.amberAccent, fontSize: 12, fontWeight: FontWeight.bold),
                    ),
                    textDirection: TextDirection.ltr,
                  )..layout();
                  tp.paint(canvas, s.screenPx + const Offset(14, -6));
                }
                return;
              }
              if (spinePx.length >= 2) {
                final path = Path();
                final p0 = _toScreen(spinePx.first, size);
                path.moveTo(p0.dx, p0.dy);
                for (int i = 1; i < spinePx.length; i++) {
                  final pi = _toScreen(spinePx[i], size);
                  path.lineTo(pi.dx, pi.dy);
                }
                canvas.drawPath(path, Paint()..color = Colors.greenAccent..style = PaintingStyle.stroke..strokeWidth = 2.5);
              }
              for (final m in marks) {
                final sc = _toScreen(m.value, size);
                canvas.drawLine(Offset(sc.dx - 14, sc.dy), Offset(sc.dx + 14, sc.dy), Paint()..color = Colors.cyanAccent..strokeWidth = 2.0);
              }
              final wl = _toScreen(waterlinePx, size);
              canvas.drawLine(Offset(wl.dx - 60, wl.dy), Offset(wl.dx + 60, wl.dy), Paint()..color = Colors.redAccent..strokeWidth = 3.5);
            }

            @override
            bool shouldRepaint(covariant CustomPainter oldDelegate) => true;
          }
          EOF

      - name: 6. OpenCV C++ SDK 다운로드
        run: |
          wget -q https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip
          unzip -q opencv-4.9.0-android-sdk.zip -d $HOME/

      - name: 7. CMakeLists.txt 생성 및 충돌 파일(.kts) 강제 삭제
        run: |
          rm -f android/build.gradle.kts android/app/build.gradle.kts android/settings.gradle.kts

          cat << 'EOF' > android/app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.18.1)
          project("draft_core")
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -O3 -ffast-math")
          set(OpenCV_DIR "$ENV{HOME}/OpenCV-android-sdk/sdk/native/jni")
          find_package(OpenCV REQUIRED COMPONENTS core imgproc video calib3d)
          add_library(draft_core SHARED draft_core_engine.cpp)
          target_include_directories(draft_core PRIVATE ${OpenCV_INCLUDE_DIRS})
          find_library(log-lib log)
          target_link_libraries(draft_core ${OpenCV_LIBS} ${log-lib})
          EOF

          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="android.hardware.camera" android:required="true"/>\n    <application|g' android/app/src/main/AndroidManifest.xml

          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }
          android {
              namespace "com.maritime.draft_survey_app"
              compileSdk 34
              ndkVersion "25.1.8937393"
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = '1.8'
              }
              defaultConfig {
                  applicationId "com.maritime.draft_survey_app"
                  minSdkVersion 24
                  targetSdkVersion 34
                  versionCode 1
                  versionName "1.0.0"
                  ndk { abiFilters 'arm64-v8a' }
                  externalNativeBuild {
                      cmake {
                          cppFlags "-std=c++17 -O3 -ffast-math"
                          arguments "-DANDROID_STL=c++_shared"
                      }
                  }
              }
              externalNativeBuild {
                  cmake {
                      path "src/main/cpp/CMakeLists.txt"
                      version "3.22.1"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          flutter { source '../..' }
          EOF

      - name: 8. APK 빌드
        run: |
          flutter build apk --release --target-platform android-arm64

      - name: 9. APK 파일 추출
        uses: actions/upload-artifact@v4
        with:
          name: DraftSurvey-APK-Installer
          path: build/app/outputs/flutter-apk/app-release.apk
