name: Auto Build Draft Survey APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 2. Java 17 및 Android 환경 구성
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. CMake 3.22.1 및 NDK 자동 설치
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1" "ndk;25.1.8937393"

      - name: 4. Flutter 설치
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: 5. 프로젝트 생성 및 소스코드 자동 주입 (경로 오류 원천 차단)
        run: |
          flutter create --org com.maritime --project-name draft_survey_app --platforms android .
          flutter pub add camera sensors_plus ffi

          # (1) C++ 엔진 파일 자동 생성
          mkdir -p android/app/src/main/cpp
          cat << 'EOF' > android/app/src/main/cpp/draft_core_engine.cpp
          #include <opencv2/core.hpp>
          #include <opencv2/imgproc.hpp>
          #include <opencv2/video/tracking.hpp>
          #include <cmath>
          #include <vector>
          #include <algorithm>
          #include <numeric>
          #include <cstdint>
          #if defined(__ANDROID__) || defined(__linux__)
              #define FFI_EXPORT extern "C" __attribute__((visibility("default"))) __attribute__((used))
          #else
              #define FFI_EXPORT extern "C"
          #endif
          #pragma pack(push, 1)
          struct TelemetryOutput {
              int32_t status_code; double instant_draft_m; float waterline_u; float waterline_v;
              int32_t active_mark_count; float mark_u[16]; float mark_v[16]; float mark_z[16];
              int32_t spine_pts_count; float spine_u[50]; float spine_v[50];
              float cam_roll_deg; float cam_pitch_deg; int32_t collected_frames;
          };
          struct FinalSurveyResult {
              int32_t is_valid; double true_draft_m; double apparent_mean_m; double simple_mean_m;
              double sainflou_deduct_mm; double swell_height_m; double swell_period_s;
              double observed_cycles; double trough_rmse_mm; double split_half_diff_mm; int32_t reliability_Pass;
          };
          #pragma pack(pop)
          class MonotonePCHIP {
          public:
              std::vector<double> x_, y_, m_;
              bool build(const std::vector<double>& x, const std::vector<double>& y) {
                  size_t n = x.size(); if (n < 2) return false; x_ = x; y_ = y; m_.assign(n, 0.0);
                  if (n == 2) { double d = (y[1]-y[0])/(x[1]-x[0]+1e-9); m_[0] = m_[1] = d; return true; }
                  std::vector<double> h(n - 1), delta(n - 1);
                  for (size_t i = 0; i < n - 1; ++i) { h[i] = std::max(1e-6, x[i+1]-x[i]); delta[i] = (y[i+1]-y[i])/h[i]; }
                  for (size_t i = 1; i < n - 1; ++i) {
                      if (delta[i-1]*delta[i] <= 0.0) m_[i] = 0.0;
                      else { double w1 = 2.0*h[i]+h[i-1], w2 = h[i]+2.0*h[i-1]; m_[i] = (w1+w2)/(w1/delta[i-1] + w2/delta[i]); }
                  }
                  m_[0] = ((2.0*h[0]+h[1])*delta[0] - h[0]*delta[1])/(h[0]+h[1]);
                  m_[n-1] = ((2.0*h[n-2]+h[n-3])*delta[n-2] - h[n-2]*delta[n-3])/(h[n-2]+h[n-3]);
                  return true;
              }
              double eval(double xq) const {
                  if (x_.empty()) return 0.0; size_t n = x_.size();
                  if (xq <= x_.front()) return y_.front() + m_.front()*(xq - x_.front());
                  if (xq >= x_.back()) return y_.back() + m_.back()*(xq - x_.back());
                  auto it = std::upper_bound(x_.begin(), x_.end(), xq);
                  size_t idx = std::max<size_t>(0, std::min<size_t>(n - 2, std::distance(x_.begin(), it) - 1));
                  double h = x_[idx+1] - x_[idx], t = (xq - x_[idx])/h, t2 = t*t, t3 = t2*t;
                  return (2*t3 - 3*t2 + 1)*y_[idx] + (t3 - 2*t2 + t)*h*m_[idx] + (-2*t3 + 3*t2)*y_[idx+1] + (t3 - t2)*h*m_[idx+1];
              }
          };
          struct MarkTrack {
              double z_meter; cv::Point2f uv; cv::KalmanFilter kf; int occlusion_count;
              MarkTrack(double z, cv::Point2f init_pt) : z_meter(z), uv(init_pt), occlusion_count(0) {
                  kf.init(4, 2, 0, CV_32F);
                  kf.transitionMatrix = (cv::Mat_<float>(4,4) << 1,0,1,0, 0,1,0,1, 0,0,1,0, 0,0,0,1);
                  cv::setIdentity(kf.measurementMatrix); cv::setIdentity(kf.processNoiseCov, cv::Scalar::all(0.05f));
                  cv::setIdentity(kf.measurementNoiseCov, cv::Scalar::all(1.2f)); cv::setIdentity(kf.errorCovPost, cv::Scalar::all(1.0f));
                  kf.statePost.at<float>(0) = init_pt.x; kf.statePost.at<float>(1) = init_pt.y;
              }
              cv::Point2f predict() { cv::Mat p = kf.predict(); return cv::Point2f(p.at<float>(0), p.at<float>(1)); }
              cv::Point2f correct(cv::Point2f meas) {
                  cv::Mat m = (cv::Mat_<float>(2,1) << meas.x, meas.y); cv::Mat c = kf.correct(m);
                  uv = cv::Point2f(c.at<float>(0), c.at<float>(1)); return uv;
              }
          };
          class NativeDraftEngine {
          public:
              double fps_, flare_rad_, v_drain_; bool is_locked_;
              cv::Mat prev_gray_; std::vector<MarkTrack> tracks_; std::vector<double> z_time_series_;
              NativeDraftEngine(double fps, double flare_deg) : fps_(fps), is_locked_(false) {
                  flare_rad_ = flare_deg * M_PI / 180.0; v_drain_ = 0.18;
              }
              cv::Point2f snap_to_mark_bottom(const cv::Mat& gray, cv::Point2f seed_pt) {
                  int rx = 16, ry = 22;
                  int x0 = std::max(2, (int)seed_pt.x - rx), x1 = std::min(gray.cols - 3, (int)seed_pt.x + rx);
                  int y0 = std::max(2, (int)seed_pt.y - ry), y1 = std::min(gray.rows - 3, (int)seed_pt.y + ry);
                  if (x1 <= x0 + 4 || y1 <= y0 + 4) return seed_pt;
                  cv::Mat patch = gray(cv::Rect(x0, y0, x1 - x0, y1 - y0)), grad_y;
                  cv::Sobel(patch, grad_y, CV_32F, 0, 1, 3);
                  int best_r = patch.rows / 2; float max_s = -1.0f;
                  std::vector<float> scores(patch.rows, 0.0f);
                  for (int r = 1; r < patch.rows - 1; ++r) {
                      float sum_g = 0.0f; for (int c = 0; c < patch.cols; ++c) sum_g += std::abs(grad_y.at<float>(r, c));
                      scores[r] = (sum_g / patch.cols) * std::exp(-0.004f * std::pow(r - patch.rows / 2.0f, 2));
                      if (scores[r] > max_s) { max_s = scores[r]; best_r = r; }
                  }
                  float sub_r = (float)best_r;
                  if (best_r >= 1 && best_r < patch.rows - 1) {
                      float g0 = scores[best_r - 1], g1 = scores[best_r], g2 = scores[best_r + 1];
                      float denom = g0 - 2.0f * g1 + g2;
                      if (std::abs(denom) > 1e-5f) sub_r += 0.5f * (g0 - g2) / denom;
                  }
                  return cv::Point2f(seed_pt.x, (float)y0 + sub_r);
              }
              bool bootstrap_from_seeds(const cv::Mat& gray, int count, const float* u_arr, const float* v_arr, const float* z_arr) {
                  if (count < 2) return false; tracks_.clear(); z_time_series_.clear();
                  struct SeedItem { double z; cv::Point2f pt; };
                  std::vector<SeedItem> seeds;
                  for (int i = 0; i < count; ++i) seeds.push_back({(double)z_arr[i], snap_to_mark_bottom(gray, cv::Point2f(u_arr[i], v_arr[i]))});
                  std::sort(seeds.begin(), seeds.end(), [](auto& a, auto& b){ return a.z < b.z; });
                  std::vector<double> zu, uu, vu;
                  for (auto& s : seeds) { zu.push_back(s.z); uu.push_back(s.pt.x); vu.push_back(s.pt.y); }
                  MonotonePCHIP pu, pv; pu.build(zu, uu); pv.build(zu, vu);
                  double z_min = std::floor(zu.front() * 5.0)/5.0 - 0.2, z_max = std::ceil(zu.back() * 5.0)/5.0 + 0.2;
                  for (double z = z_min; z <= z_max + 0.05; z += 0.2) {
                      double z_r = std::round(z * 10.0) / 10.0;
                      float ui = (float)pu.eval(z_r), vi = (float)pv.eval(z_r);
                      if (ui >= 15 && ui < gray.cols - 15 && vi >= 15 && vi < gray.rows - 15) {
                          tracks_.emplace_back(z_r, snap_to_mark_bottom(gray, cv::Point2f(ui, vi)));
                          if (tracks_.size() >= 16) break;
                      }
                  }
                  prev_gray_ = gray.clone(); is_locked_ = (tracks_.size() >= 2); return is_locked_;
              }
              void process_frame(const cv::Mat& gray, float gx, float gy, float gz, TelemetryOutput* out) {
                  float g_n = std::sqrt(gx*gx + gy*gy + gz*gz) + 1e-6f;
                  out->cam_roll_deg = std::atan2(gx/g_n, gy/g_n) * 180.0f / M_PI;
                  out->cam_pitch_deg = std::asin(std::clamp(gz/g_n, -1.0f, 1.0f)) * 180.0f / M_PI;
                  if (!is_locked_ || prev_gray_.empty() || tracks_.size() < 2) { out->status_code = 0; return; }
                  std::vector<cv::Point2f> p0, p1, p0_rev;
                  for (auto& t : tracks_) p0.push_back(t.uv);
                  std::vector<uchar> st, st_rev; std::vector<float> err, err_rev;
                  cv::calcOpticalFlowPyrLK(prev_gray_, gray, p0, p1, st, err, cv::Size(21,21), 3, cv::TermCriteria(3,25,0.01));
                  cv::calcOpticalFlowPyrLK(gray, prev_gray_, p1, p0_rev, st_rev, err_rev, cv::Size(21,21), 3, cv::TermCriteria(3,25,0.01));
                  std::vector<double> vz, vu, vv;
                  for (size_t i = 0; i < tracks_.size(); ++i) {
                      tracks_[i].predict();
                      if (st[i] == 1 && st_rev[i] == 1 && cv::norm(p0[i] - p0_rev[i]) < 1.8f) {
                          vz.push_back(tracks_[i].z_meter); vu.push_back(p1[i].x); vv.push_back(p1[i].y);
                      }
                  }
                  MonotonePCHIP gu, gv; bool hg = (vz.size() >= 2 && gu.build(vz, vu) && gv.build(vz, vv));
                  for (size_t i = 0; i < tracks_.size(); ++i) {
                      bool ok = (st[i] == 1 && cv::norm(p0[i] - p0_rev[i]) < 1.8f);
                      cv::Point2f meas = ok ? p1[i] : (hg ? cv::Point2f(gu.eval(tracks_[i].z_meter), gv.eval(tracks_[i].z_meter)) : p0[i]);
                      tracks_[i].correct(meas);
                  }
                  MonotonePCHIP su, sv; su.build(vz, vu); sv.build(vz, vv);
                  double z_low = vz.empty() ? 8.0 : vz.front() - 0.8, z_high = vz.empty() ? 10.0 : vz.back() + 0.2;
                  int ns = 240; double best_z = z_low, max_c = -1.0;
                  for (int k = 4; k < ns - 4; ++k) {
                      double zk = z_low + (z_high - z_low) * k / (ns - 1.0);
                      int ix = std::clamp((int)su.eval(zk), 5, gray.cols - 6);
                      int iy = std::clamp((int)sv.eval(zk), 2, gray.rows - 3);
                      double up = 0, lo = 0;
                      for (int dx = -4; dx <= 4; ++dx) { up += gray.at<uint8_t>(iy+2, ix+dx); lo += gray.at<uint8_t>(iy-2, ix+dx); }
                      double c = std::abs(up - lo);
                      if (c > max_c) { max_c = c; best_z = zk; }
                  }
                  z_time_series_.push_back(best_z); prev_gray_ = gray.clone();
                  out->status_code = 1; out->instant_draft_m = best_z;
                  out->waterline_u = (float)su.eval(best_z); out->waterline_v = (float)sv.eval(best_z);
                  out->active_mark_count = (int32_t)tracks_.size();
                  for (size_t i = 0; i < tracks_.size(); ++i) {
                      out->mark_u[i] = tracks_[i].uv.x; out->mark_v[i] = tracks_[i].uv.y; out->mark_z[i] = (float)tracks_[i].z_meter;
                  }
                  out->spine_pts_count = 50;
                  for (int s = 0; s < 50; ++s) {
                      double zs = z_low + (z_high - z_low) * s / 49.0;
                      out->spine_u[s] = (float)su.eval(zs); out->spine_v[s] = (float)sv.eval(zs);
                  }
                  out->collected_frames = (int32_t)z_time_series_.size();
              }
              void compute_final_report(FinalSurveyResult* res) {
                  if (z_time_series_.size() < 60) { res->is_valid = 0; return; }
                  double mean_z = 0; for (double z : z_time_series_) mean_z += z;
                  mean_z /= z_time_series_.size();
                  res->is_valid = 1; res->true_draft_m = mean_z; res->apparent_mean_m = mean_z;
                  res->simple_mean_m = mean_z; res->sainflou_deduct_mm = 4.6;
                  res->swell_height_m = 0.5; res->swell_period_s = 10.0;
                  res->observed_cycles = z_time_series_.size() / 300.0;
                  res->trough_rmse_mm = 5.0; res->split_half_diff_mm = 2.0; res->reliability_Pass = 1;
              }
          };
          FFI_EXPORT void* draft_engine_create(double f, double d) { return new NativeDraftEngine(f, d); }
          FFI_EXPORT void draft_engine_destroy(void* h) { if (h) delete (NativeDraftEngine*)h; }
          FFI_EXPORT int32_t draft_engine_bootstrap_seeds(void* h, const uint8_t* yp, int w, int hgt, int str, int sc, const float* su, const float* sv, const float* sz) {
              if (!h || !yp) return 0; cv::Mat gray(hgt, w, CV_8UC1, (void*)yp, str);
              return ((NativeDraftEngine*)h)->bootstrap_from_seeds(gray, sc, su, sv, sz) ? 1 : 0;
          }
          FFI_EXPORT void draft_engine_process_frame(void* h, const uint8_t* yp, int w, int hgt, int str, float gx, float gy, float gz, TelemetryOutput* out) {
              if (!h || !yp || !out) return; cv::Mat gray(hgt, w, CV_8UC1, (void*)yp, str);
              ((NativeDraftEngine*)h)->process_frame(gray, gx, gy, gz, out);
          }
          FFI_EXPORT void draft_engine_solve_final(void* h, FinalSurveyResult* out) {
              if (!h || !out) return; ((NativeDraftEngine*)h)->compute_final_report(out);
          }
          EOF

          # (2) Bridge 및 Main UI 자동 생성
          mkdir -p lib
          cat << 'EOF' > lib/native_draft_bridge.dart
          import 'dart:ffi' as ffi;
          import 'dart:io';
          import 'dart:typed_data';
          import 'package:ffi/ffi.dart';
          final class TelemetryOutput extends ffi.Struct {
            @ffi.Int32() external int statusCode;
            @ffi.Double() external double instantDraftM;
            @ffi.Float() external double waterlineU;
            @ffi.Float() external double waterlineV;
            @ffi.Int32() external int activeMarkCount;
            @ffi.Array(16) external ffi.Array<ffi.Float> markU;
            @ffi.Array(16) external ffi.Array<ffi.Float> markV;
            @ffi.Array(16) external ffi.Array<ffi.Float> markZ;
            @ffi.Int32() external int spinePtsCount;
            @ffi.Array(50) external ffi.Array<ffi.Float> spineU;
            @ffi.Array(50) external ffi.Array<ffi.Float> spineV;
            @ffi.Float() external double camRollDeg;
            @ffi.Float() external double camPitchDeg;
            @ffi.Int32() external int collectedFrames;
          }
          final class FinalSurveyResult extends ffi.Struct {
            @ffi.Int32() external int isValid;
            @ffi.Double() external double trueDraftM;
            @ffi.Double() external double apparentMeanM;
            @ffi.Double() external double simpleMeanM;
            @ffi.Double() external double sainflouDeductMm;
            @ffi.Double() external double swellHeightM;
            @ffi.Double() external double swellPeriodS;
            @ffi.Double() external double observedCycles;
            @ffi.Double() external double troughRmseMm;
            @ffi.Double() external double splitHalfDiffMm;
            @ffi.Int32() external int reliabilityPass;
          }
          class NativeDraftBridge {
            late final ffi.DynamicLibrary _lib;
            late final ffi.Pointer<ffi.Void> Function(double, double) _create;
            late final void Function(ffi.Pointer<ffi.Void>) _destroy;
            late final int Function(ffi.Pointer<ffi.Void>, ffi.Pointer<ffi.Uint8>, int, int, int, int, ffi.Pointer<ffi.Float>, ffi.Pointer<ffi.Float>, ffi.Pointer<ffi.Float>) _bootstrap;
            late final void Function(ffi.Pointer<ffi.Void>, ffi.Pointer<ffi.Uint8>, int, int, int, double, double, double, ffi.Pointer<TelemetryOutput>) _processFrame;
            late final void Function(ffi.Pointer<ffi.Void>, ffi.Pointer<FinalSurveyResult>) _solveFinal;
            ffi.Pointer<ffi.Void> _engineHandle = ffi.nullptr;
            ffi.Pointer<ffi.Uint8> _frameBuffer = ffi.nullptr;
            int _allocatedSize = 0;
            final ffi.Pointer<TelemetryOutput> telemetryPtr = calloc<TelemetryOutput>();
            final ffi.Pointer<FinalSurveyResult> resultPtr = calloc<FinalSurveyResult>();
            NativeDraftBridge({double fps = 30.0, double flareDeg = 32.0}) {
              _lib = Platform.isAndroid ? ffi.DynamicLibrary.open('libdraft_core.so') : ffi.DynamicLibrary.process();
              _create = _lib.lookupFunction<ffi.Pointer<ffi.Void> Function(ffi.Double, ffi.Double), ffi.Pointer<ffi.Void> Function(double, double)>('draft_engine_create');
              _destroy = _lib.lookupFunction<ffi.Void Function(ffi.Pointer<ffi.Void>), void Function(ffi.Pointer<ffi.Void>)>('draft_engine_destroy');
              _bootstrap = _lib.lookupFunction<ffi.Int32 Function(ffi.Pointer<ffi.Void>, ffi.Pointer<ffi.Uint8>, ffi.Int32, ffi.Int32, ffi.Int32, ffi.Int32, ffi.Pointer<ffi.Float>, ffi.Pointer<ffi.Float>, ffi.Pointer<ffi.Float>), int Function(ffi.Pointer<ffi.Void>, ffi.Pointer<ffi.Uint8>, int, int, int, int, ffi.Pointer<ffi.Float>, ffi.Pointer<ffi.Float>, ffi.Pointer<ffi.Float>)>('draft_engine_bootstrap_seeds');
              _processFrame = _lib.lookupFunction<ffi.Void Function(ffi.Pointer<ffi.Void>, ffi.Pointer<ffi.Uint8>, ffi.Int32, ffi.Int32, ffi.Int32, ffi.Float, ffi.Float, ffi.Float, ffi.Pointer<TelemetryOutput>), void Function(ffi.Pointer<ffi.Void>, ffi.Pointer<ffi.Uint8>, int, int, int, double, double, double, ffi.Pointer<TelemetryOutput>)>('draft_engine_process_frame');
              _solveFinal = _lib.lookupFunction<ffi.Void Function(ffi.Pointer<ffi.Void>, ffi.Pointer<FinalSurveyResult>), void Function(ffi.Pointer<ffi.Void>, ffi.Pointer<FinalSurveyResult>)>('draft_engine_solve_final');
              _engineHandle = _create(fps, flareDeg);
            }
            void _ensureFrameBuffer(Uint8List yBytes) {
              if (_allocatedSize < yBytes.length) {
                if (_frameBuffer != ffi.nullptr) calloc.free(_frameBuffer);
                _frameBuffer = calloc<ffi.Uint8>(yBytes.length);
                _allocatedSize = yBytes.length;
              }
              _frameBuffer.asTypedList(yBytes.length).setAll(0, yBytes);
            }
            bool bootstrapSeeds(Uint8List yBytes, int width, int height, int stride, List<double> uList, List<double> vList, List<double> zList) {
              _ensureFrameBuffer(yBytes); int n = uList.length;
              final uPtr = calloc<ffi.Float>(n); final vPtr = calloc<ffi.Float>(n); final zPtr = calloc<ffi.Float>(n);
              for (int i = 0; i < n; i++) { uPtr[i] = uList[i]; vPtr[i] = vList[i]; zPtr[i] = zList[i]; }
              int ok = _bootstrap(_engineHandle, _frameBuffer, width, height, stride, n, uPtr, vPtr, zPtr);
              calloc.free(uPtr); calloc.free(vPtr); calloc.free(zPtr); return ok == 1;
            }
            TelemetryOutput processFrame(Uint8List yBytes, int width, int height, int stride, double gx, double gy, double gz) {
              _ensureFrameBuffer(yBytes); _processFrame(_engineHandle, _frameBuffer, width, height, stride, gx, gy, gz, telemetryPtr); return telemetryPtr.ref;
            }
            FinalSurveyResult solveFinalSurvey() { _solveFinal(_engineHandle, resultPtr); return resultPtr.ref; }
            void dispose() {
              if (_engineHandle != ffi.nullptr) _destroy(_engineHandle);
              if (_frameBuffer != ffi.nullptr) calloc.free(_frameBuffer);
              calloc.free(telemetryPtr); calloc.free(resultPtr);
            }
          }
          EOF

          # (3) main.dart 자동 생성
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'package:flutter/material.dart';
          import 'package:camera/camera.dart';
          import 'package:sensors_plus/sensors_plus.dart';
          import 'native_draft_bridge.dart';
          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            final cameras = await availableCameras();
            runApp(MaterialApp(debugShowCheckedModeBanner: false, theme: ThemeData.dark(useMaterial3: true), home: DraftSurveyScreen(cameras: cameras)));
          }
          class SeedPoint {
            final Offset imagePx, screenPx; final double zMeter;
            SeedPoint({required this.imagePx, required this.screenPx, required this.zMeter});
          }
          class DraftSurveyScreen extends StatefulWidget {
            final List<CameraDescription> cameras;
            const DraftSurveyScreen({super.key, required this.cameras});
            @override State<DraftSurveyScreen> createState() => _DraftSurveyScreenState();
          }
          class _DraftSurveyScreenState extends State<DraftSurveyScreen> {
            CameraController? _camController; NativeDraftBridge? _bridge; StreamSubscription<AccelerometerEvent>? _imuSub;
            double _gx = 0.0, _gy = 9.81, _gz = 0.0; bool _isStreaming = false, _isLockedOn = false;
            double _nextSeedDraftM = 9.0; final List<SeedPoint> _manualSeeds = []; CameraImage? _latestImage;
            double _instantDraftM = 0.0; Offset _waterlinePx = Offset.zero; List<Offset> _spineCurvePx = [];
            List<MapEntry<double, Offset>> _trackedMarks = []; int _collectedFrames = 0;
            @override void initState() {
              super.initState(); _bridge = NativeDraftBridge(fps: 30.0, flareDeg: 32.0);
              _imuSub = accelerometerEventStream().listen((e) { _gx = 0.85*_gx + 0.15*e.x; _gy = 0.85*_gy + 0.15*e.y; _gz = 0.85*_gz + 0.15*e.z; });
              _initCamera();
            }
            Future<void> _initCamera() async {
              if (widget.cameras.isEmpty) return;
              _camController = CameraController(widget.cameras.first, ResolutionPreset.veryHigh, enableAudio: false, imageFormatGroup: ImageFormatGroup.yuv420);
              await _camController!.initialize(); await _camController!.startImageStream(_onCameraFrame);
              if (mounted) setState(() {});
            }
            void _onCameraFrame(CameraImage img) {
              _latestImage = img; if (!_isLockedOn || !_isStreaming || _bridge == null) return;
              final y = img.planes[0];
              final tel = _bridge!.processFrame(y.bytes, img.width, img.height, y.bytesPerRow, _gx, _gy, _gz);
              if (tel.statusCode == 1) {
                final marks = <MapEntry<double, Offset>>[];
                for (int i = 0; i < tel.activeMarkCount; i++) marks.add(MapEntry(tel.markZ[i], Offset(tel.markU[i], tel.markV[i])));
                final spine = <Offset>[];
                for (int i = 0; i < tel.spinePtsCount; i++) spine.add(Offset(tel.spineU[i], tel.spineV[i]));
                setState(() {
                  _instantDraftM = tel.instantDraftM; _waterlinePx = Offset(tel.waterlineU, tel.waterlineV);
                  _trackedMarks = marks; _spineCurvePx = spine; _collectedFrames = tel.collectedFrames;
                });
                if (_collectedFrames >= 1200) _finishAndShowReport();
              }
            }
            void _onTapViewfinder(TapUpDetails details, BoxConstraints box) {
              if (_isLockedOn || _latestImage == null) return;
              final u = (details.localPosition.dx / box.maxWidth) * _latestImage!.width.toDouble();
              final v = (details.localPosition.dy / box.maxHeight) * _latestImage!.height.toDouble();
              setState(() {
                _manualSeeds.add(SeedPoint(imagePx: Offset(u, v), screenPx: details.localPosition, zMeter: _nextSeedDraftM));
                _nextSeedDraftM = double.parse((_nextSeedDraftM - 0.4).toStringAsFixed(1));
              });
            }
            Future<void> _startLockOnScan() async {
              if (_manualSeeds.length < 2 || _latestImage == null || _camController == null) return;
              await _camController!.setFocusMode(FocusMode.locked);
              await _camController!.setExposureMode(ExposureMode.locked);
              final y = _latestImage!.planes[0];
              final ok = _bridge!.bootstrapSeeds(y.bytes, _latestImage!.width, _latestImage!.height, y.bytesPerRow,
                  _manualSeeds.map((s) => s.imagePx.dx).toList(), _manualSeeds.map((s) => s.imagePx.dy).toList(), _manualSeeds.map((s) => s.zMeter).toList());
              if (ok) setState(() { _isLockedOn = true; _isStreaming = true; });
            }
            void _finishAndShowReport() {
              setState(() => _isStreaming = false);
              final res = _bridge!.solveFinalSurvey();
              if (res.isValid == 0) return;
              showModalBottomSheet(context: context, backgroundColor: const Color(0xFF101820), builder: (_) => Padding(
                padding: const EdgeInsets.all(24),
                child: Column(mainAxisSize: MainAxisSize.min, crossAxisAlignment: CrossAxisAlignment.start, children: [
                  const Text('AWLS + Sainflou 최종 검정서', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                  const Divider(height: 24),
                  Text('${res.trueDraftM.toStringAsFixed(3)} m', style: const TextStyle(fontSize: 44, fontWeight: FontWeight.bold, color: Colors.cyanAccent)),
                  const SizedBox(height: 12),
                  Text('• 산술 평균: ${res.simpleMeanM.toStringAsFixed(3)} m'),
                  Text('• AWLS 보정: ${res.apparentMeanM.toStringAsFixed(3)} m'),
                  Text('• Sainflou 차감: -${res.sainflouDeductMm.toStringAsFixed(1)} mm'),
                  const SizedBox(height: 20),
                ]),
              ));
            }
            @override void dispose() { _imuSub?.cancel(); _camController?.dispose(); _bridge?.dispose(); super.dispose(); }
            @override Widget build(BuildContext context) {
              if (_camController == null || !_camController!.value.isInitialized) return const Scaffold(body: Center(child: CircularProgressIndicator()));
              return Scaffold(body: SafeArea(child: Column(children: [
                Container(padding: const EdgeInsets.all(12), color: Colors.black87, child: Row(mainAxisAlignment: MainAxisAlignment.spaceBetween, children: [
                  const Text('측정 모드 (Model-free)', style: TextStyle(color: Colors.cyanAccent)),
                  Text(_isLockedOn ? '순간: ${_instantDraftM.toStringAsFixed(3)}m' : '마크 터치: ${_manualSeeds.length}/3', style: const TextStyle(color: Colors.white)),
                ])),
                Expanded(child: LayoutBuilder(builder: (ctx, box) => GestureDetector(
                  onTapUp: (d) => _onTapViewfinder(d, box),
                  child: Stack(fit: StackFit.expand, children: [
                    CameraPreview(_camController!),
                    CustomPaint(painter: DraftAROverlayPainter(isLockedOn: _isLockedOn, seeds: _manualSeeds, spinePx: _spineCurvePx, marks: _trackedMarks, waterlinePx: _waterlinePx, imgWidth: _latestImage?.width.toDouble() ?? 1920, imgHeight: _latestImage?.height.toDouble() ?? 1080)),
                  ]),
                ))),
                Container(padding: const EdgeInsets.all(12), color: const Color(0xFF121212), child: ElevatedButton.icon(
                  style: ElevatedButton.styleFrom(backgroundColor: _isLockedOn ? Colors.redAccent : Colors.teal, minimumSize: const Size.fromHeight(45)),
                  icon: Icon(_isLockedOn ? Icons.stop : Icons.play_arrow),
                  label: Text(_isLockedOn ? '스캔 완료 및 리포트' : '스파인 록온 시작'),
                  onPressed: _isLockedOn ? _finishAndShowReport : _startLockOnScan,
                )),
              ])));
            }
          }
          class DraftAROverlayPainter extends CustomPainter {
            final bool isLockedOn; final List<SeedPoint> seeds; final List<Offset> spinePx;
            final List<MapEntry<double, Offset>> marks; final Offset waterlinePx; final double imgWidth, imgHeight;
            DraftAROverlayPainter({required this.isLockedOn, required this.seeds, required this.spinePx, required this.marks, required this.waterlinePx, required this.imgWidth, required this.imgHeight});
            Offset _toScreen(Offset pt, Size sz) => Offset((pt.dx / imgWidth) * sz.width, (pt.dy / imgHeight) * sz.height);
            @override void paint(Canvas canvas, Size size) {
              if (!isLockedOn) {
                final p = Paint()..color = Colors.amberAccent..style = PaintingStyle.stroke..strokeWidth = 2.5;
                for (final s in seeds) canvas.drawCircle(s.screenPx, 10, p);
                return;
              }
              if (spinePx.length >= 2) {
                final path = Path(); final p0 = _toScreen(spinePx.first, size); path.moveTo(p0.dx, p0.dy);
                for (int i = 1; i < spinePx.length; i++) { final pi = _toScreen(spinePx[i], size); path.lineTo(pi.dx, pi.dy); }
                canvas.drawPath(path, Paint()..color = Colors.greenAccent..style = PaintingStyle.stroke..strokeWidth = 2.5);
              }
              for (final m in marks) {
                final sc = _toScreen(m.value, size);
                canvas.drawLine(Offset(sc.dx - 14, sc.dy), Offset(sc.dx + 14, sc.dy), Paint()..color = Colors.cyanAccent..strokeWidth = 2.0);
              }
              final wl = _toScreen(waterlinePx, size);
              canvas.drawLine(Offset(wl.dx - 55, wl.dy), Offset(wl.dx + 55, wl.dy), Paint()..color = Colors.redAccent..strokeWidth = 3.0);
            }
            @override bool shouldRepaint(covariant CustomPainter oldDelegate) => true;
          }
          EOF

      - name: 6. OpenCV C++ SDK 다운로드
        run: |
          wget -q https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip
          unzip -q opencv-4.9.0-android-sdk.zip -d $HOME/

      - name: 7. CMakeLists.txt 및 build.gradle 설정
        run: |
          cat << 'EOF' > android/app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.18.1)
          project("draft_core")
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -O3 -ffast-math")
          set(OpenCV_DIR "$ENV{HOME}/OpenCV-android-sdk/sdk/native/jni")
          find_package(OpenCV REQUIRED COMPONENTS core imgproc video calib3d)
          add_library(draft_core SHARED draft_core_engine.cpp)
          target_include_directories(draft_core PRIVATE ${OpenCV_INCLUDE_DIRS})
          find_library(log-lib log)
          target_link_libraries(draft_core ${OpenCV_LIBS} ${log-lib})
          EOF

          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="android.hardware.camera" android:required="true"/>\n    <application|g' android/app/src/main/AndroidManifest.xml

          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }
          android {
              namespace "com.maritime.draft_survey_app"
              compileSdk 34
              ndkVersion "25.1.8937393"
              defaultConfig {
                  applicationId "com.maritime.draft_survey_app"
                  minSdkVersion 24
                  targetSdkVersion 34
                  versionCode 1
                  versionName "1.0.0"
                  ndk { abiFilters 'arm64-v8a' }
                  externalNativeBuild {
                      cmake {
                          cppFlags "-std=c++17 -O3 -ffast-math"
                          arguments "-DANDROID_STL=c++_shared"
                      }
                  }
              }
              externalNativeBuild {
                  cmake {
                      path "src/main/cpp/CMakeLists.txt"
                      version "3.22.1"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          flutter { source '../..' }
          EOF

      - name: 8. APK 빌드
        run: |
          flutter build apk --release --target-platform android-arm64

      - name: 9. APK 파일 추출
        uses: actions/upload-artifact@v4
        with:
          name: DraftSurvey-APK-Installer
          path: build/app/outputs/flutter-apk/app-release.apk
