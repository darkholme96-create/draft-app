name: Auto Build Draft Survey APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 내가 올린 소스코드 다운로드
        uses: actions/checkout@v4

      - name: 2. Java 17 및 Android SDK/CMake/NDK 환경 구성
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Android CMake 3.22.1 및 NDK 자동 설치
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1" "ndk;25.1.8937393"

      - name: 4. Flutter SDK 설치
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: 5. 프로젝트 초기화 및 Dart 문법 오타 자동 교정
        run: |
          mkdir -p /tmp/my_src/lib /tmp/my_src/cpp
          cp lib/*.dart /tmp/my_src/lib/
          cp cpp/draft_core_engine.cpp /tmp/my_src/cpp/

          flutter create --org com.maritime --project-name draft_survey_app --platforms android .
          flutter pub add camera sensors_plus ffi

          cp /tmp/my_src/lib/*.dart lib/
          # native_draft_bridge.dart 내 uint8_t 오타를 ffi.Uint8로 자동 수정
          sed -i 's/ffi.Pointer< uint8_t >/ffi.Pointer<ffi.Uint8>/g' lib/native_draft_bridge.dart
          sed -i 's/uint8_t/ffi.Uint8/g' lib/native_draft_bridge.dart

          mkdir -p android/app/src/main/cpp
          cp /tmp/my_src/cpp/draft_core_engine.cpp android/app/src/main/cpp/

      - name: 6. OpenCV 4.9.0 Android C++ SDK 다운로드
        run: |
          wget -q https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip
          unzip -q opencv-4.9.0-android-sdk.zip -d $HOME/

      - name: 7. CMakeLists.txt, build.gradle, 카메라 권한 자동 생성
        run: |
          cat << 'EOF' > android/app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.18.1)
          project("draft_core")
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -O3 -ffast-math")
          set(OpenCV_DIR "$ENV{HOME}/OpenCV-android-sdk/sdk/native/jni")
          find_package(OpenCV REQUIRED COMPONENTS core imgproc video calib3d)
          add_library(draft_core SHARED draft_core_engine.cpp)
          target_include_directories(draft_core PRIVATE ${OpenCV_INCLUDE_DIRS})
          find_library(log-lib log)
          target_link_libraries(draft_core ${OpenCV_LIBS} ${log-lib})
          EOF

          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="android.hardware.camera" android:required="true"/>\n    <application|g' android/app/src/main/AndroidManifest.xml

          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }
          android {
              namespace "com.maritime.draft_survey_app"
              compileSdk 34
              ndkVersion "25.1.8937393"
              defaultConfig {
                  applicationId "com.maritime.draft_survey_app"
                  minSdkVersion 24
                  targetSdkVersion 34
                  versionCode 1
                  versionName "1.0.0"
                  ndk { abiFilters 'arm64-v8a' }
                  externalNativeBuild {
                      cmake {
                          cppFlags "-std=c++17 -O3 -ffast-math"
                          arguments "-DANDROID_STL=c++_shared"
                      }
                  }
              }
              externalNativeBuild {
                  cmake {
                      path "src/main/cpp/CMakeLists.txt"
                      version "3.22.1"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          flutter { source '../..' }
          EOF

      - name: 8. APK 빌드 (약 4~5분 소요)
        run: |
          flutter build apk --release --target-platform android-arm64

      - name: 9. 완성된 APK 파일 추출
        uses: actions/upload-artifact@v4
        with:
          name: DraftSurvey-APK-Installer
          path: build/app/outputs/flutter-apk/app-release.apk
